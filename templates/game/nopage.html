<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Игра "Кандзи"</title>
    {% load static %}
    <link rel="icon" href="{% static 'game/favicon.ico' %}" type="image/x-icon">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url("{% static 'game/images/background.jpg' %}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            font-family: sans-serif;
        }

        .content {
            background-color: rgba(0, 0, 0, 0.6);
            margin: 5vh auto;
            padding: 30px;
            width: 80%;
            max-width: 600px;
            border-radius: 15px;
            text-align: center;
        }

        h2 {
            color: #fff;
        }


        p {
            font-size: 18px;
        }
        
        .del_button {
            margin-top: 10px;
            display: block;
            font-size: 16px;
            color: #fff;
            text-decoration: underline;
        }

        .btn {
            display: inline-block;
            margin: 10px 8px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #9932CC;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #491961;
        }

        .back-btn {
            margin-top: 10px;
            display: block;
            font-size: 16px;
            color: #fff;
            text-decoration: none;
        }
        .back-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="content">
        {% block content %}
        <h2>Такой страницы пока нет...</h2>
        <a class="back-btn" href="/">Вернуться на главную</a>
        {% endblock %}
    </div>
</body>
</html>
