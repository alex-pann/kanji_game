<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link rel="icon" href="{% static 'game/favicon.ico' %}">
    <title>Вход</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url("{% static 'game/images/background.jpg' %}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            text-align: center;
            height: 100vh;
            font-family: sans-serif;
            color: white;
        }
        .container {
            width: 100%;
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            background-color: rgba(0, 0, 0, 0.7); /* Полупрозрачный черный фон */
            border-radius: 10px;
        }
        h2 {
            color: white;
            font-size: 28px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 16px;
            margin-bottom: 10px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #d664e3;
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #7d3c84;
        }
        .back-btn {
            margin-top: 10px;
            display: block;
            font-size: 16px;
            color: #fff;
            text-decoration: none;
        }
        .back-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        {% block content %}
            <h2>Вход</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn">Войти</button>
            </form>
            <a class="back-btn" href="/">Вернуться на главную</a>
        {% endblock %}
    </div>
</body>
</html>
